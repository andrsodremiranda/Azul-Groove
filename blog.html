<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog & Novidades - ASTM Software</title>
    <link rel="icon" href="aumentar-o-tamanho-d.png" type="image/png" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
:root{--bg:#07091a;--card:#0f1330;--line:#222a5c;--tx:#e9ecff;--mut:#9aa3d6;--ac:#5865f2;--ac2:#1fb6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.glow{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 15% 0,rgba(88,101,242,.22),transparent),radial-gradient(500px 400px at 95% 10%,rgba(31,182,255,.13),transparent)}
nav{position:sticky;top:0;z-index:10;background:rgba(7,9,26,.88);border-bottom:1px solid var(--line)}
nav .wrap{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.logo i{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--ac)}
.license-page-container,.privacy-page-container,.blog-container,.page{max-width:900px;margin:0 auto;padding:32px 20px 60px}
.blog-container{max-width:1000px}
.header-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:14px}
.back-button{display:inline-flex;align-items:center;color:var(--ac2);font-weight:600}
.back-button:hover{color:#fff}
.lang-btn{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px;font-weight:600;font-family:inherit}
.lang-btn:hover{border-color:var(--ac)}
.license-page-content,.privacy-card,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:44px}
.license-page-content h1,.privacy-card h1,.card h1{color:#fff;font-size:clamp(1.5rem,4vw,2rem);line-height:1.25;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.license-page-content h2,.license-page-content h3,.privacy-card h3,.card h3{color:var(--ac2);margin:30px 0 10px;font-size:1.2rem}
.license-page-content p,.license-page-content li,.privacy-card p,.privacy-card li,.card p,.card li{color:var(--mut);line-height:1.75;margin-bottom:12px;font-size:1rem}
.license-page-content strong,.privacy-card strong,.card strong{color:var(--tx)}
.license-page-content ul,.privacy-card ul,.card ul{padding-left:22px;margin-bottom:18px}
.license-page-content a,.privacy-card a,.card a{color:#8ea1ff}
.license-page-content a:hover,.privacy-card a:hover,.card a:hover{text-decoration:underline}
.update-info{font-size:.9rem;color:var(--mut);margin-bottom:30px}
.summary{background:rgba(88,101,242,.1);border-left:3px solid var(--ac);border-radius:0 12px 12px 0;padding:16px 20px;margin-bottom:10px}
.summary p{margin:0 0 8px}.summary p:last-child{margin-bottom:0}
.foot{margin-top:40px;font-size:.88rem;color:var(--mut);border-top:1px solid var(--line);padding-top:18px}
#en-content{display:none}
.blog-header{text-align:center;margin-bottom:34px}
.blog-header h1{color:#fff;font-size:clamp(1.7rem,5vw,2.3rem);margin-bottom:8px}
.blog-header p{color:var(--mut)}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.post-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.post-card:hover{border-color:var(--ac)}
.post-date{font-size:.78rem;color:var(--ac2);font-weight:700;margin-bottom:8px;text-transform:uppercase}
.post-title{color:#fff;font-size:1.2rem;margin-bottom:10px;font-weight:700;line-height:1.4}
.post-snippet{color:var(--mut);font-size:.94rem;margin-bottom:18px;flex-grow:1}
.post-link{display:inline-flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(135deg,var(--ac),#7a5cff);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;width:fit-content}
.loading-spinner{text-align:center;padding:50px;color:var(--ac2);font-size:1.3rem;grid-column:1/-1}
@media(max-width:768px){.license-page-content,.privacy-card,.card{padding:28px 18px}}
</style>
</head>
<body>
    <div class="glow"></div>

    <nav><div class="wrap"><a class="logo" href="index.html"><i class="fab fa-discord"></i> Azul Groove</a><a class="btn" href="index.html">Voltar / Back</a></div></nav>

    <div class="blog-container">
        
        <div class="header-actions">
            <a href="index.html" class="back-button" id="backBtn">
                <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Voltar para o Início
            </a>
            
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">
                🇺🇸 English
            </button>
        </div>

        <div class="blog-header">
            <h1 data-pt="Notícias e Atualizações" data-en="News & Updates">Notícias e Atualizações</h1>
            <p data-pt="Acompanhe as últimas postagens oficiais da ASTM Software" data-en="Follow official posts from ASTM Software">
                Acompanhe as últimas postagens oficiais da ASTM Software
            </p>
        </div>

        <div class="posts-grid" id="blog-posts">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> <span data-pt="Carregando postagens..." data-en="Loading posts...">Carregando postagens...</span>
            </div>
        </div>

    </div>

    <script>
        const savedLang = localStorage.getItem('site_lang');
        const browserLang = navigator.language || navigator.userLanguage;
        let isEnglish = savedLang === 'en' || (!savedLang && browserLang.startsWith('en'));

        function applyPageLang() {
            const btn = document.getElementById('langToggleBtn');
            const backBtn = document.getElementById('backBtn');

            if (btn) btn.innerHTML = isEnglish ? '🇧🇷 Português' : '🇺🇸 English';
            if (backBtn) {
                backBtn.innerHTML = isEnglish 
                    ? '<i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Back to Home' 
                    : '<i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Voltar para o Início';
            }

            document.querySelectorAll('[data-pt]').forEach(el => {
                el.innerText = isEnglish ? el.getAttribute('data-en') : el.getAttribute('data-pt');
            });
        }

        function toggleLanguage() {
            isEnglish = !isEnglish;
            localStorage.setItem('site_lang', isEnglish ? 'en' : 'pt');
            applyPageLang();
        }

        // Função que busca as postagens diretamente do seu Blogger via Feed JSON
        function loadBloggerPosts() {
            const blogUrl = 'https://astmsoft.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderPosts';
            const script = document.createElement('script');
            script.src = blogUrl;
            document.body.appendChild(script);
        }

        function renderPosts(data) {
            const container = document.getElementById('blog-posts');
            container.innerHTML = '';

            if (!data.feed.entry || data.feed.entry.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Nenhuma postagem encontrada.</p>';
                return;
            }

            data.feed.entry.forEach(entry => {
                const title = entry.title.$t;
                const published = new Date(entry.published.$t).toLocaleDateString(isEnglish ? 'en-US' : 'pt-BR', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });

                // Extrai o link original do post
                const postLink = entry.link.find(l => l.rel === 'alternate').href;

                // Limpa as tags HTML do conteúdo para gerar um resumo
                let contentSnippet = entry.summary ? entry.summary.$t : (entry.content ? entry.content.$t : '');
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = contentSnippet;
                contentSnippet = tempDiv.textContent || tempDiv.innerText || '';
                if (contentSnippet.length > 150) {
                    contentSnippet = contentSnippet.substring(0, 150) + '...';
                }

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div>
                        <div class="post-date">${published}</div>
                        <div class="post-title">${title}</div>
                        <div class="post-snippet">${contentSnippet}</div>
                    </div>
                    <a href="${postLink}" target="_blank" rel="noopener noreferrer" class="post-link">
                        ${isEnglish ? 'Read Full Post' : 'Ler Post Completo'} <i class="fas fa-external-link-alt"></i>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyPageLang();
            loadBloggerPosts();
        });
    </script>
</body>
</html>
